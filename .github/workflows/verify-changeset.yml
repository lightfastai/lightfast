# Verify that changesets follow semantic versioning guidelines
# - patch: Bug fixes, performance improvements  
# - minor: New features, non-breaking changes
# - major: Breaking changes, API changes
name: changeset-verify
run-name: changeset-verify / ${{ github.event_name }} / ${{ github.head_ref || github.ref_name }}

# Runs only on PRs that touch changeset files for publishable core packages.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
    paths:
      - '.changeset/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changeset-verify:
    name: changeset-verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: setup-node-22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: verify-changeset-format
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          checked=0

          while IFS= read -r -d '' file; do
            checked=$((checked + 1))
            echo "Checking $file"

            if [ ! -f "$file" ]; then
              echo "::error::Changeset file $file not found"
              exit 1
            fi

            frontmatter="$(sed -n '2,/^---$/p' "$file")"

            if grep -qE "^[[:space:]]*(\"@lightfastai/cli\"|'@lightfastai/cli')[[:space:]]*:[[:space:]]*(patch|minor|major)[[:space:]]*$" <<< "$frontmatter"; then
              echo "::error::@lightfastai/cli releases must not use Changesets. Follow RELEASE.md#cli-workflow instead."
              exit 1
            fi

            for package in lightfast @lightfastai/mcp; do
              if ! grep -qE "^\"$package\": (patch|minor|major)$" <<< "$frontmatter"; then
                echo "::error::Changeset $file must include a valid bump for both lightfast and @lightfastai/mcp"
                exit 1
              fi
            done

            summary="$(awk 'BEGIN { delimiters = 0 } /^---$/ { delimiters += 1; next } delimiters >= 2 { print }' "$file")"
            if ! grep -q '[^[:space:]]' <<< "$summary"; then
              echo "::error::Changeset $file must include a summary description"
              exit 1
            fi

            echo "✓ $file is valid"
          done < <(git diff --diff-filter=dr --name-only -z "$BASE_SHA" -- '.changeset/*.md')

          echo "Checked $checked changed changeset file(s)."
          echo "All changesets are valid!"
