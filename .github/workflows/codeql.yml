name: codeql-security
run-name: codeql-security / ${{ github.event_name }} / ${{ github.head_ref || github.ref_name }}

on:
  push:
    branches: [main]
  # Pull requests run CodeQL as part of pull-request-validation.yml.
  schedule:
    - cron: "30 3 * * 1"

jobs:
  codeql-analyze:
    name: codeql-analyze-${{ matrix.language }}
    if: ${{ github.event.repository.private == false || vars.CODEQL_ADVANCED_SECURITY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: initialize-codeql
        uses: github/codeql-action/init@ed410739ba306e4ebe5e123421a6bd694e494a2b # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: analyze-codeql
        uses: github/codeql-action/analyze@ed410739ba306e4ebe5e123421a6bd694e494a2b # v4
        with:
          category: "/language:${{ matrix.language }}"
