name: pull-request-validation
run-name: pull-request-validation / ${{ github.event_name }} / ${{ github.head_ref || github.ref_name }}

# Runs the complete repository gate on the exact pull-request head before an
# ordinary protected merge.
on:
  pull_request:

concurrency:
  group: pull-request-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pull-request-quality:
    name: pull-request-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup-pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: setup-node-22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: install-dependencies
        run: pnpm install --frozen-lockfile

      - name: check-format-and-lint
        run: pnpm turbo run //#check --summarize

      - name: check-workspace-dependencies
        run: pnpm lint:ws

      - name: typecheck-full
        env:
          SKIP_ENV_VALIDATION: "true"
        run: pnpm turbo run typecheck --continue --summarize

      - name: check-boundaries
        run: pnpm turbo boundaries

      - name: check-dead-code
        run: pnpm turbo run //#knip --summarize

      - name: turbo-cache-report
        if: always()
        uses: ./.github/actions/turbo-summary
        with:
          title: 'Turbo cache report - pull-request-validation / pull-request-quality'
          artifact-name: turbo-cache-pull-request-quality

  pull-request-core-build-test:
    name: pull-request-core-build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup-pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: setup-node-22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: install-dependencies
        run: pnpm install --frozen-lockfile

      - name: build-public-packages
        env:
          SKIP_ENV_VALIDATION: "true"
        run: pnpm turbo run build --filter=lightfast --filter=@lightfastai/mcp --filter=@lightfastai/cli --summarize

      - name: test-public-surface
        env:
          SKIP_ENV_VALIDATION: "true"
        run: pnpm turbo run test --filter=@repo/api-contract --filter=@api/app --filter=lightfast --filter=@lightfastai/cli --filter=@lightfastai/mcp --filter=@repo/mcp-tools --filter=@vendor/mcp --summarize

      - name: verify-build-outputs
        run: |
          test -f core/lightfast/dist/index.mjs
          test -f core/mcp/dist/index.mjs
          test -f core/cli/dist/bin.mjs

      - name: turbo-cache-report
        if: always()
        uses: ./.github/actions/turbo-summary
        with:
          title: 'Turbo cache report - pull-request-validation / pull-request-core-build-test'
          artifact-name: turbo-cache-pull-request-core-build-test

  pull-request-local-tools:
    name: pull-request-local-tools
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup-pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: setup-node-22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: install-dependencies
        run: pnpm install --frozen-lockfile

      - name: build-local-tools
        run: pnpm turbo run build --filter=@lightfast/desktop --filter=@lightfast/mcp-local --filter=@lightfast/example --summarize

      - name: test-local-tools
        run: pnpm turbo run test --filter=@lightfast/desktop --filter=@lightfast/mcp-local --filter=@lightfast/example --summarize

      - name: turbo-cache-report
        if: always()
        uses: ./.github/actions/turbo-summary
        with:
          title: 'Turbo cache report - pull-request-validation / pull-request-local-tools'
          artifact-name: turbo-cache-pull-request-local-tools

  pull-request-codeql:
    name: pull-request-codeql-${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Uploads pull-request analysis results to code scanning.
      security-events: write
      # Reads packages and workflow metadata required by CodeQL.
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: initialize-codeql
        uses: github/codeql-action/init@ed410739ba306e4ebe5e123421a6bd694e494a2b # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: analyze-codeql
        uses: github/codeql-action/analyze@ed410739ba306e4ebe5e123421a6bd694e494a2b # v4
        with:
          category: "/language:${{ matrix.language }}"

  pull-request-validation:
    name: pull-request-validation
    if: always()
    needs:
      - pull-request-quality
      - pull-request-core-build-test
      - pull-request-local-tools
      - pull-request-codeql
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: evaluate-gate
        env:
          QUALITY_RESULT: ${{ needs['pull-request-quality'].result }}
          CORE_RESULT: ${{ needs['pull-request-core-build-test'].result }}
          LOCAL_TOOLS_RESULT: ${{ needs['pull-request-local-tools'].result }}
          CODEQL_RESULT: ${{ needs['pull-request-codeql'].result }}
        run: |
          echo "quality=$QUALITY_RESULT core=$CORE_RESULT local_tools=$LOCAL_TOOLS_RESULT codeql=$CODEQL_RESULT"
          if [[ "$QUALITY_RESULT" != "success" || "$CORE_RESULT" != "success" || "$LOCAL_TOOLS_RESULT" != "success" || "$CODEQL_RESULT" != "success" ]]; then
            echo "Pull-request validation failed."
            exit 1
          fi
          echo "All pull-request validation checks passed."
