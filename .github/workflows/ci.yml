name: repo-ci
run-name: repo-ci / ${{ github.event_name }} / ${{ github.head_ref || github.ref_name }}

# Runs on PRs touching app, package, core, data, vendor, or workspace files that need the
# affected lint/typecheck/test/boundary suite.
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'api/**'
      - 'db/**'
      - 'internal/**'
      - 'packages/**'
      - 'core/**'
      - 'vendor/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'api/**'
      - 'db/**'
      - 'internal/**'
      - 'packages/**'
      - 'core/**'
      - 'vendor/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/ci.yml'

# Cancel previous runs on new pushes to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo-lint-typecheck-test-boundaries:
    name: repo-lint-typecheck-test-boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: setup-pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: setup-node-22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: install-dependencies
        run: pnpm install --frozen-lockfile

      - name: lint-biome
        run: pnpm turbo run //#check --summarize

      - name: typecheck-affected-packages
        env:
          SKIP_ENV_VALIDATION: "true"
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm turbo run typecheck --affected --continue --summarize

      - name: test-public-surface
        env:
          SKIP_ENV_VALIDATION: "true"
        run: pnpm turbo run test --filter=@repo/api-contract --filter=@api/app --filter=lightfast --filter=@lightfastai/cli --filter=@lightfastai/mcp --filter=@lightfast/mcp-local --filter=@repo/mcp-tools --filter=@vendor/mcp --continue --summarize

      - name: check-boundaries
        run: pnpm turbo boundaries

      - name: turbo-cache-report
        if: always()
        uses: ./.github/actions/turbo-summary
        with:
          title: 'Turbo cache report - repo-ci / repo-lint-typecheck-test-boundaries'
          artifact-name: turbo-cache-repo-ci-lint-typecheck-test-boundaries

  # Summary job
  repo-ci-success:
    name: repo-ci-success
    if: always()
    needs: [repo-lint-typecheck-test-boundaries]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: evaluate-results
        run: |
          repo_checks="${{ needs['repo-lint-typecheck-test-boundaries'].result }}"

          echo "repo-lint-typecheck-test-boundaries.result = $repo_checks"

          if [[ "$repo_checks" != "success" ]]; then
            echo "CI quality checks failed."
            exit 1
          fi

          echo "All CI checks passed."
