name: merge-queue
run-name: merge-queue / ${{ github.event_name }} / ${{ github.head_ref || github.ref_name }}

# The pull-request event supplies the required admission stub. The merge-group
# event runs the complete repository gate before GitHub integrates the change.
on:
  pull_request:
  merge_group:

concurrency:
  group: merge-queue-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  merge-queue-quality:
    name: merge-queue-quality
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup-pnpm
        uses: pnpm/action-setup@v4

      - name: setup-node-22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: install-dependencies
        run: pnpm install --frozen-lockfile

      - name: check-format-and-lint
        run: pnpm turbo run //#check --summarize

      - name: check-workspace-dependencies
        run: pnpm lint:ws

      - name: typecheck-full
        env:
          SKIP_ENV_VALIDATION: "true"
        run: pnpm turbo run typecheck --continue --summarize

      - name: check-boundaries
        run: pnpm turbo boundaries

      - name: check-dead-code
        run: pnpm turbo run //#knip --summarize

      - name: turbo-cache-report
        if: always()
        uses: ./.github/actions/turbo-summary
        with:
          title: 'Turbo cache report - merge-queue / merge-queue-quality'
          artifact-name: turbo-cache-merge-queue-quality

  merge-queue-core-build-test:
    name: merge-queue-core-build-test
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup-pnpm
        uses: pnpm/action-setup@v4

      - name: setup-node-22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: install-dependencies
        run: pnpm install --frozen-lockfile

      - name: build-public-packages
        env:
          SKIP_ENV_VALIDATION: "true"
        run: pnpm turbo run build --filter=lightfast --filter=@lightfastai/mcp --filter=@lightfastai/cli --summarize

      - name: test-public-surface
        env:
          SKIP_ENV_VALIDATION: "true"
        run: pnpm turbo run test --filter=@repo/api-contract --filter=@api/app --filter=lightfast --filter=@lightfastai/cli --filter=@lightfastai/mcp --filter=@repo/mcp-tools --filter=@vendor/mcp --summarize

      - name: verify-build-outputs
        run: |
          test -f core/lightfast/dist/index.mjs
          test -f core/mcp/dist/index.mjs
          test -f core/cli/dist/bin.mjs

      - name: turbo-cache-report
        if: always()
        uses: ./.github/actions/turbo-summary
        with:
          title: 'Turbo cache report - merge-queue / merge-queue-core-build-test'
          artifact-name: turbo-cache-merge-queue-core-build-test

  merge-queue-local-tools:
    name: merge-queue-local-tools
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup-pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: setup-node-22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: install-dependencies
        run: pnpm install --frozen-lockfile

      - name: build-local-tools
        run: pnpm turbo run build --filter=@lightfast/desktop --filter=@lightfast/mcp-local --filter=@lightfast/example --summarize

      - name: test-local-tools
        run: pnpm turbo run test --filter=@lightfast/desktop --filter=@lightfast/mcp-local --filter=@lightfast/example --summarize

      - name: turbo-cache-report
        if: always()
        uses: ./.github/actions/turbo-summary
        with:
          title: 'Turbo cache report - merge-queue / merge-queue-local-tools'
          artifact-name: turbo-cache-merge-queue-local-tools

  merge-queue-codeql:
    name: merge-queue-codeql-${{ matrix.language }}
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: initialize-codeql
        uses: github/codeql-action/init@ed410739ba306e4ebe5e123421a6bd694e494a2b # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: analyze-codeql
        uses: github/codeql-action/analyze@ed410739ba306e4ebe5e123421a6bd694e494a2b # v4
        with:
          category: "/language:${{ matrix.language }}"

  merge-queue-success:
    name: merge-queue-success
    if: always()
    needs:
      - merge-queue-quality
      - merge-queue-core-build-test
      - merge-queue-local-tools
      - merge-queue-codeql
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: evaluate-gate
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "PR admission stub passed; the full battery runs in merge queue."
            exit 0
          fi
          quality="${{ needs['merge-queue-quality'].result }}"
          core="${{ needs['merge-queue-core-build-test'].result }}"
          local_tools="${{ needs['merge-queue-local-tools'].result }}"
          codeql="${{ needs['merge-queue-codeql'].result }}"
          echo "quality=$quality core=$core local_tools=$local_tools codeql=$codeql"
          if [[ "$quality" != "success" || "$core" != "success" || "$local_tools" != "success" || "$codeql" != "success" ]]; then
            echo "Merge queue gate failed."
            exit 1
          fi
          echo "All merge queue checks passed."
